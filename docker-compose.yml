services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crm_password}
      POSTGRES_DB: ${POSTGRES_DB:-crm}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-crm} -d ${POSTGRES_DB:-crm}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - crm_internal

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - crm_internal

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api/Dockerfile
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-crm}:${POSTGRES_PASSWORD:-crm_password}@postgres:5432/${POSTGRES_DB:-crm}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379
      API_HOST: 0.0.0.0
      API_PORT: 3001
      API_CORS_ORIGIN: ${API_CORS_ORIGIN:-http://localhost:3000}
      API_SWAGGER_ENABLED: ${API_SWAGGER_ENABLED:-true}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-crm_session}
      AUTH_SESSION_TTL_SECONDS: ${AUTH_SESSION_TTL_SECONDS:-604800}
      AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:-}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      PASSWORD_MIN_LENGTH: ${PASSWORD_MIN_LENGTH:-12}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
      AI_PROVIDER: ${AI_PROVIDER:-fake}
      AI_DEFAULT_MODEL: ${AI_DEFAULT_MODEL:-fake-v1}
      OUTREACH_GENERATION_BATCH_SIZE: ${OUTREACH_GENERATION_BATCH_SIZE:-25}
      DELIVERY_ATTEMPTS: ${DELIVERY_ATTEMPTS:-5}
      DELIVERY_BACKOFF_MS: ${DELIVERY_BACKOFF_MS:-2000}
      INBOUND_PROVIDER: ${INBOUND_PROVIDER:-fake}
      RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:-}
      INBOUND_MAX_BODY_BYTES: ${INBOUND_MAX_BODY_BYTES:-262144}
      INBOUND_ATTEMPTS: ${INBOUND_ATTEMPTS:-5}
      INBOUND_BACKOFF_MS: ${INBOUND_BACKOFF_MS:-2000}
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - crm_internal

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/worker/Dockerfile
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-crm}:${POSTGRES_PASSWORD:-crm_password}@postgres:5432/${POSTGRES_DB:-crm}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379
      API_HOST: 0.0.0.0
      API_PORT: 3001
      API_CORS_ORIGIN: ${API_CORS_ORIGIN:-http://localhost:3000}
      API_SWAGGER_ENABLED: ${API_SWAGGER_ENABLED:-true}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-crm_session}
      AUTH_SESSION_TTL_SECONDS: ${AUTH_SESSION_TTL_SECONDS:-604800}
      AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:-}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      PASSWORD_MIN_LENGTH: ${PASSWORD_MIN_LENGTH:-12}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
      AI_PROVIDER: ${AI_PROVIDER:-fake}
      AI_DEFAULT_MODEL: ${AI_DEFAULT_MODEL:-fake-v1}
      OUTREACH_GENERATION_BATCH_SIZE: ${OUTREACH_GENERATION_BATCH_SIZE:-25}
      DELIVERY_ATTEMPTS: ${DELIVERY_ATTEMPTS:-5}
      DELIVERY_BACKOFF_MS: ${DELIVERY_BACKOFF_MS:-2000}
      INBOUND_PROVIDER: ${INBOUND_PROVIDER:-fake}
      RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:-}
      INBOUND_MAX_BODY_BYTES: ${INBOUND_MAX_BODY_BYTES:-262144}
      INBOUND_ATTEMPTS: ${INBOUND_ATTEMPTS:-5}
      INBOUND_BACKOFF_MS: ${INBOUND_BACKOFF_MS:-2000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - crm_internal

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web/Dockerfile
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:3001}
      WEB_PORT: 3000
    ports:
      - '3000:3000'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - crm_internal

volumes:
  postgres_data:

networks:
  crm_internal:
    driver: bridge
